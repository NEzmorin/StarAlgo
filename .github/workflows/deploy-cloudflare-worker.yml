name: Deploy StarAlgo Cloudflare Worker

on:
  push:
    branches:
      - vercel-migration
    paths:
      - "worker.js"
      - "functions/api/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staralgo-cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out vercel-migration
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials detected; Worker deployment is enabled."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Worker build validated. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions repository secrets to enable deployment."
            {
              echo "## Cloudflare Worker deployment skipped"
              echo "The Worker bundle passed its dry-run build, but deployment secrets are not configured."
              echo "Add repository Actions secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, then rerun this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy Cloudflare Worker
        if: steps.credentials.outputs.available == 'true'
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
